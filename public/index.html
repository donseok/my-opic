<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPIc Master</title>

  <!-- 글로벌 스타일 -->
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/survey.css">
  <link rel="stylesheet" href="/css/level.css">
  <link rel="stylesheet" href="/css/questions.css">
  <link rel="stylesheet" href="/css/exam.css">
  <link rel="stylesheet" href="/css/feedback.css">
  <link rel="stylesheet" href="/css/dashboard.css">

  <!-- CDN: Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- CDN: Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- 상단 헤더 -->
  <header class="app-header">
    <div class="header-content">
      <span class="header-icon">🎓</span>
      <h1 class="header-title">OPIc Master</h1>
    </div>
  </header>

  <!-- 메인 콘텐츠 영역 -->
  <main id="app-content" class="app-content">
    <!-- SPA 라우터가 여기에 화면을 렌더링 -->
  </main>

  <!-- 하단 탭바 네비게이션 -->
  <nav class="tab-bar">
    <button class="tab-item active" data-tab="survey">
      <i data-lucide="clipboard-list"></i>
      <span>서베이</span>
    </button>
    <button class="tab-item" data-tab="questions">
      <i data-lucide="book-open"></i>
      <span>문제은행</span>
    </button>
    <button class="tab-item" data-tab="exam">
      <i data-lucide="pen-tool"></i>
      <span>모의시험</span>
    </button>
    <button class="tab-item" data-tab="feedback">
      <i data-lucide="message-circle"></i>
      <span>AI피드백</span>
    </button>
    <button class="tab-item" data-tab="dashboard">
      <i data-lucide="bar-chart-2"></i>
      <span>대시보드</span>
    </button>
    <button class="tab-item" data-tab="level">
      <i data-lucide="target"></i>
      <span>레벨설정</span>
    </button>
  </nav>

  <!-- JS 모듈 -->
  <script src="/js/api.js"></script>
  <script src="/js/survey.js"></script>
  <script src="/js/level.js"></script>
  <script src="/js/questions.js"></script>
  <script src="/js/utils/timer.js"></script>
  <script src="/js/utils/wordcount.js"></script>
  <script src="/js/exam.js"></script>
  <script src="/js/feedback.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/app.js"></script>

</body>
</html>
